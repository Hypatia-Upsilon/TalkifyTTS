name: Build & Sign Release APK

on:
  workflow_dispatch:
    inputs:
      custom_package_name:
        description: '临时自定义包名（留空使用默认包名）'
        required: false
        default: 'com.github.lonepheasantwarrior.talkify'
  push:
    tags:
      - 'v*' # 也可以在推送 Tag 时自动触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------------------
      # 需求 1 & 2：在 CI 临时修改 applicationId 并仅保留 arm64-v8a
      # -------------------------------------------------------------
      - name: Apply CI Modifications (Package Name & ABI Filters)
        run: |
          # 1. 自定义包名（如果不传则使用默认值）
          NEW_APP_ID="${{ github.event.inputs.custom_package_name }}"
          if [ -z "$NEW_APP_ID" ]; then
            NEW_APP_ID="com.github.lonepheasantwarrior.talkify"
          fi
          echo "Using applicationId: $NEW_APP_ID"
          # 替换 build.gradle.kts 中的 applicationId
          sed -i -E "s/applicationId = \".*\"/applicationId = \"$NEW_APP_ID\"/" app/build.gradle.kts

          # 2. 仅保留 arm64-v8a ABI，关闭 universal 包以节省构建时间和产物大小
          echo "Configuring single ABI: arm64-v8a..."
          sed -i -E 's/abiFilters \+= listOf\(.*\)/abiFilters += listOf("arm64-v8a")/' app/build.gradle.kts
          sed -i -E 's/include\(.*\)/include("arm64-v8a")/' app/build.gradle.kts
          sed -i -E 's/isUniversalApk = true/isUniversalApk = false/' app/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 构建 Release 包（此时产出未签名的 arm64-v8a APK）
      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      # -------------------------------------------------------------
      # 需求 3：CI 流程签名（使用 apksigner，无需改动 build.gradle.kts）
      # -------------------------------------------------------------
      - name: Sign APK with apksigner
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 1. 还原 Keystore 文件
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          # 2. 定位生成的 arm64-v8a APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -type f -name "*arm64-v8a*.apk" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"
          SIGNED_APK="${UNSIGNED_APK%.apk}-signed.apk"

          # 3. 获取 build-tools 中的 apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # 4. 执行 V2/V3/V4 签名
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          # 5. 校验签名状态
          "$APKSIGNER" verify -v "$SIGNED_APK"

          # 6. 删除临时 keystore 和未签名的原始 APK
          rm -f release.keystore
          rm -f "$UNSIGNED_APK"

      # 上传构建产物
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Talkify-arm64-v8a-Signed
          path: app/build/outputs/apk/release/*-signed.apk
          if-no-files-found: error
